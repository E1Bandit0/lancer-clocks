<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lancer Clocks</title>
<link rel="stylesheet" href="popover.css">
</head>
<body>
<header class="bar"><span class="pre">CLK//</span> Lancer Clocks</header>

<section id="mine">
  <p id="playerNote" class="note" hidden>The GM runs the clocks. Hover over a clock, then drag its top-left handle to move it or its bottom-right corner to resize it. Your layout is only on your screen.</p>
  <div class="row">
    <label class="check"><input type="checkbox" id="showMine" checked> Show clocks on my screen</label>
    <button type="button" id="reset" class="ghost">Reset layout</button>
  </div>
</section>

<section id="gm" hidden>
  <div id="legacy" class="legacy" hidden>
    <p id="legacyText"></p>
    <button type="button" id="legacyBtn" class="ghost">Remove them</button>
  </div>

  <form id="new">
    <fieldset class="seg">
      <legend>New</legend>
      <label><input type="radio" name="kind" value="progress" checked> Clock</label>
      <label><input type="radio" name="kind" value="score"> Score</label>
    </fieldset>

    <label class="field" data-only="progress">Label
      <input name="label" type="text" maxlength="40" placeholder="Dropship ETA">
    </label>
    <div class="pair" data-only="score" hidden>
      <label class="field">Players
        <input name="pcLabel" type="text" maxlength="40" placeholder="Players">
      </label>
      <label class="field">Hostiles
        <input name="enemyLabel" type="text" maxlength="40" placeholder="Hostiles">
      </label>
    </div>

    <div class="row">
      <label class="field inline">Segments <select name="segments"></select></label>
      <label class="check" data-only="progress"><input type="checkbox" name="countdown"> Countdown</label>
    </div>
    <label class="check"><input type="checkbox" name="shown" checked> Players see it straight away</label>

    <button type="submit" class="primary">Add clock</button>
  </form>

  <h2>Clocks in this room</h2>
  <ul id="list"></ul>
</section>

<script type="module" src="popover.js"></script>
</body>
</html>
